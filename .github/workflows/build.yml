name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: select xcode version
        run: |
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          fi
          xcodebuild -version

      - name: install xcodegen
        run: brew install xcodegen

      - name: generate xcode project
        run: xcodegen generate

      - name: build app
        run: |
          xcodebuild build \
            -project unixruner.xcodeproj \
            -scheme unixruner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: package unsigned ipa
        run: |
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/unixruner.app build/Payload/
          cd build
          zip -r unixruner-unsigned.ipa Payload
          cd ..

      - name: upload ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: unixruner-unsigned
          path: build/unixruner-unsigned.ipa
          retention-days: 14
